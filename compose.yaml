name: sees-platform
services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5549:5432"
    environment:
      POSTGRES_DB: sees_dev
      POSTGRES_USER: sees
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the local database}
    volumes:
      - sees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sees -d sees_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  sees-postgres:
